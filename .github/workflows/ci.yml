name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Fails when core line coverage drops below 60% (vitest.config.mts).
      - name: Unit tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Production dependencies only. Non-blocking until the runtime/dependency
      # upgrade (socket.io-client, postcss via next/tailwind) clears today's
      # high findings; then drop continue-on-error so it gates merges.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: petal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E smoke (live Frappe bench)
    runs-on: ubuntu-latest
    needs: check
    # Runs only when a bench is configured: set the PETAL_E2E_FRAPPE_URL
    # variable and the PETAL_E2E_PASSWORD secret (user: PETAL_E2E_USER, default
    # Administrator). Petal is built and started here against that backend.
    if: ${{ vars.PETAL_E2E_FRAPPE_URL != '' }}
    env:
      FRAPPE_BACKEND_URL: ${{ vars.PETAL_E2E_FRAPPE_URL }}
      PETAL_E2E_URL: http://localhost:3000
      PETAL_E2E_USER: ${{ vars.PETAL_E2E_USER || 'Administrator' }}
      PETAL_E2E_PASSWORD: ${{ secrets.PETAL_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @petal/core build
      - name: Start Petal
        run: |
          pnpm --filter @petal/core start -p 3000 > petal.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login > /dev/null && exit 0; sleep 2; done
          cat petal.log; exit 1
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            petal.log
          if-no-files-found: ignore
